name: Weekly TQQQ Volatility Report

on:
  schedule:
    # Every Friday at 22:10 UTC (~5:10pm ET after market close)
    - cron: "10 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch + weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit outputs back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Make sure these folders exist even if script didn't create them for some reason
          mkdir -p data output logs

          # Add EVERYTHING that changed (including new files/folders)
          git add -A

          # Commit only if something changed
          git diff --cached --quiet && echo "No changes" || git commit -m "Weekly TQQQ vol report"

          # Push to main
          git push
