name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode (debug or official). Official is blocked unless it's Friday (UTC)."
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - official
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decide run mode
        run: |
          set -e
          # scheduled runs => official
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "RUN_MODE=official" >> $GITHUB_ENV
          else
            echo "RUN_MODE=${{ inputs.run_mode }}" >> $GITHUB_ENV
          fi

      - name: Guardrail - Official only allowed on Friday
        run: |
          set -e
          if [ "${RUN_MODE}" != "official" ]; then
            echo "✅ Debug mode allowed (RUN_MODE=${RUN_MODE})"
            exit 0
          fi

          # Official mode: only allow on Friday (UTC)
          DOW="$(date -u +%u)"   # 1=Mon ... 5=Fri ... 7=Sun
          if [ "$DOW" != "5" ]; then
            echo "❌ Official run blocked: today is not Friday (UTC day=$DOW). Use debug mode."
            exit 1
          fi
          echo "✅ Official mode allowed (Friday UTC)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit updated data + report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ logs/ output/
          git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d)) [${RUN_MODE}]" || echo "No changes"
          git push

      # Publish HTML to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Prepare notification text (always, but only if the report exists)
      - name: Prepare notification text
        if: always()
        run: |
          set -e

          if [ ! -f "output/subject.txt" ] || [ ! -f "output/message.txt" ] || [ ! -f "output/latest_report_url.txt" ]; then
            echo "⚠️ Report files not found (run likely blocked). Skipping notify body."
            echo "SKIP_NOTIFICATIONS=1" >> $GITHUB_ENV
            exit 0
          fi

          REPORT_URL="$(cat output/latest_report_url.txt)"
          SUBJECT="$(cat output/subject.txt)"
          MESSAGE="$(cat output/message.txt)"

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

      # Push notification (Pushover)
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set -e

          if [ "${SKIP_NOTIFICATIONS:-0}" = "1" ]; then
            echo "Skipping Pushover (no report generated)."
            exit 0
          fi

          if [ -z "${PUSHOVER_USER_KEY:-}" ]; then
            echo "❌ Missing PUSHOVER_USER_KEY secret"
            exit 1
          fi
          if [ -z "${PUSHOVER_API_TOKEN:-}" ]; then
            echo "❌ Missing PUSHOVER_API_TOKEN secret"
            exit 1
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json

      # Email (SMTP)
      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          if os.environ.get("SKIP_NOTIFICATIONS", "0") == "1":
              print("Skipping email (no report generated).")
              raise SystemExit(0)

          notify_path = "/tmp/notify_body.txt"
          if not os.path.exists(notify_path):
              print("Skipping email: notify body missing.")
              raise SystemExit(0)

          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port = int(os.environ.get("SMTP_PORT", "587"))
          smtp_user = os.environ["SMTP_USERNAME"]
          smtp_pass = os.environ["SMTP_PASSWORD"]
          email_from = os.environ["EMAIL_FROM"]
          email_to = os.environ["EMAIL_TO"]

          subject = os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report")
          body = open(notify_path, "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
              s.ehlo()
              s.starttls()
              s.login(smtp_user, smtp_pass)
              s.send_message(msg)

          print(f"✅ Email sent to {email_to}")
          PY
