#!/usr/bin/env python3
from __future__ import annotations

import json
import math
import os
from datetime import datetime, timezone
from pathlib import Path
from string import Template

import pandas as pd

# =========================
# CONFIG
# =========================
TARGET_VOL = 0.20         # 20% target
LOOKBACK_DAYS = 20
ROUND_STEP = 0.05         # 5% steps
TRADING_DAYS = 252

HISTORY_DAYS = 365

BASE = Path(__file__).resolve().parent
DATA_DIR = BASE / "data"
LOG_DIR = BASE / "logs"
OUTPUT_DIR = BASE / "output"
REPORTS_DIR = OUTPUT_DIR / "reports"
DEBUG_REPORTS_DIR = REPORTS_DIR / "debug"

PRICE_FILE = DATA_DIR / "TQQQ.csv"

HISTORY_OFFICIAL = LOG_DIR / "history_official.csv"
HISTORY_DEBUG = LOG_DIR / "history_debug.csv"

# GitHub Pages base (update if repo/user changes)
PAGES_BASE_URL = "https://stegitforme.github.io/tqqq-vol-target"

OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
REPORTS_DIR.mkdir(parents=True, exist_ok=True)
DEBUG_REPORTS_DIR.mkdir(parents=True, exist_ok=True)
LOG_DIR.mkdir(parents=True, exist_ok=True)

# =========================
# HELPERS
# =========================
def utc_now_str() -> str:
    return datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

def realized_vol_annual(close: pd.Series, window: int) -> float:
    rets = close.pct_change().dropna()
    # ddof=0 to be stable across environments; change to ddof=1 if you prefer sample std
    vol_daily = rets.rolling(window).std(ddof=0).iloc[-1]
    return float(vol_daily) * math.sqrt(TRADING_DAYS)

def round_to_step(x: float, step: float) -> float:
    # round to nearest step
    return round(x / step) * step

def clamp(x: float, lo: float = 0.0, hi: float = 1.0) -> float:
    return max(lo, min(hi, x))

def load_history(path: Path) -> pd.DataFrame:
    if not path.exists():
        return pd.DataFrame(columns=["RunDate", "Close", "RealizedVol20d", "TargetVol", "AllocTQQQ", "AllocCash"])
    df = pd.read_csv(path, parse_dates=["RunDate"])
    df["RunDate"] = pd.to_datetime(df["RunDate"]).dt.normalize()
    df = df.sort_values("RunDate").reset_index(drop=True)
    # keep last row per day (in case re-run same day)
    df = df.drop_duplicates(subset=["RunDate"], keep="last").reset_index(drop=True)
    return df

def write_history(path: Path, df: pd.DataFrame) -> None:
    out = df.copy()
    out["RunDate"] = pd.to_datetime(out["RunDate"]).dt.date.astype(str)
    out.to_csv(path, index=False)

def append_history_row(hist_path: Path, run_date: pd.Timestamp, close: float, vol20: float, alloc: float) -> pd.DataFrame:
    hist = load_history(hist_path)

    row = {
        "RunDate": pd.to_datetime(run_date).normalize(),
        "Close": float(close),
        "RealizedVol20d": float(vol20),
        "TargetVol": float(TARGET_VOL),
        "AllocTQQQ": float(alloc),
        "AllocCash": float(1.0 - alloc),
    }

    hist = pd.concat([hist, pd.DataFrame([row])], ignore_index=True)

    hist["RunDate"] = pd.to_datetime(hist["RunDate"]).dt.normalize()
    hist = hist.sort_values("RunDate")
    hist = hist.drop_duplicates(subset=["RunDate"], keep="last").reset_index(drop=True)

    # trim to last HISTORY_DAYS (timezone-naive to avoid tz compare bugs)
    cutoff = pd.Timestamp.utcnow().normalize().tz_localize(None) - pd.Timedelta(days=HISTORY_DAYS)
    hist["RunDate"] = pd.to_datetime(hist["RunDate"]).dt.tz_localize(None)
    hist = hist[hist["RunDate"] >= cutoff].reset_index(drop=True)

    write_history(hist_path, hist)
    return hist

def fmt_pct(x: float) -> str:
    return f"{x:.1f}%"

# =========================
# MAIN
# =========================
def main() -> None:
    # DEBUG_RUN comes from workflow ("Decide run mode")
    debug_run = os.environ.get("DEBUG_RUN", "0") == "1"
    mode = os.environ.get("MODE", "debug" if debug_run else "official")

    if not PRICE_FILE.exists():
        raise FileNotFoundError(f"Missing {PRICE_FILE}. Did fetch_tqqq.py run?")

    px = pd.read_csv(PRICE_FILE, parse_dates=["Date"]).sort_values("Date")
    if "Close" not in px.columns:
        raise RuntimeError(f"{PRICE_FILE} must have a Close column")

    px = px.set_index("Date")
    close = px["Close"].astype(float)

    if len(close) < LOOKBACK_DAYS + 5:
        raise RuntimeError(f"Not enough rows to compute {LOOKBACK_DAYS}d vol")

    # Use last available close date as the run date
    run_date = pd.to_datetime(close.index[-1]).normalize()
    last_close = float(close.iloc[-1])

    # compute realized vol
    vol20 = realized_vol_annual(close, LOOKBACK_DAYS)

    # compute allocation
    raw_alloc = (TARGET_VOL / vol20) if vol20 > 0 else 1.0
    alloc = clamp(raw_alloc, 0.0, 1.0)
    alloc = round_to_step(alloc, ROUND_STEP)
    alloc = clamp(alloc, 0.0, 1.0)

    # Append to correct history file(s)
    if debug_run:
        hist = append_history_row(HISTORY_DEBUG, run_date, last_close, vol20, alloc)
    else:
        hist = append_history_row(HISTORY_OFFICIAL, run_date, last_close, vol20, alloc)

    if hist.empty:
        raise RuntimeError("History is empty after append (unexpected)")

    # Previous allocation = last row strictly before current run_date
    hist["RunDate"] = pd.to_datetime(hist["RunDate"]).dt.normalize()
    prev_rows = hist[hist["RunDate"] < run_date]
    if len(prev_rows) > 0:
        prev_alloc = float(prev_rows.iloc[-1]["AllocTQQQ"])
    else:
        prev_alloc = float(hist.iloc[-1]["AllocTQQQ"])

    prev_alloc_pct = int(round(prev_alloc * 100))
    curr_alloc_pct = int(round(alloc * 100))
    curr_cash_pct = 100 - curr_alloc_pct
    realized_vol_pct = float(vol20) * 100

    run_date_str = run_date.strftime("%Y-%m-%d")

    # Chart data (last 365 points)
    chart_df = hist.tail(365).copy()
    chart_dates = pd.to_datetime(chart_df["RunDate"]).dt.strftime("%Y-%m-%d").tolist()
    chart_alloc = (chart_df["AllocTQQQ"] * 100).round(2).tolist()
    chart_vol = (chart_df["RealizedVol20d"] * 100).round(2).tolist()

    chart_dates_js = json.dumps(chart_dates)
    chart_alloc_js = json.dumps(chart_alloc)
    chart_vol_js = json.dumps(chart_vol)

    # Report paths
    if debug_run:
        # avoid overwriting the official dated page
        # include time so multiple debug runs don't collide
        tstamp = datetime.now(timezone.utc).strftime("%H%M")
        report_rel_path = f"reports/debug/{run_date_str}_{tstamp}.html"
        report_file = DEBUG_REPORTS_DIR / f"{run_date_str}_{tstamp}.html"
        latest_file = OUTPUT_DIR / "debug_report.html"
    else:
        report_rel_path = f"reports/{run_date_str}.html"
        report_file = REPORTS_DIR / f"{run_date_str}.html"
        latest_file = OUTPUT_DIR / "weekly_report.html"

    report_url = f"{PAGES_BASE_URL}/{report_rel_path}"

    # Save helper files for workflow notifications
    (OUTPUT_DIR / "latest_report_path.txt").write_text(report_rel_path, encoding="utf-8")
    (OUTPUT_DIR / "latest_report_url.txt").write_text(report_url, encoding="utf-8")

    # Subject + message for Pushover/email
    subject = f"TQQQ Vol Target | {curr_alloc_pct}% TQQQ / {curr_cash_pct}% Cash | Vol20={realized_vol_pct:.1f}%"
    message = (
        f"{subject}\n"
        f"Mode={mode}\n"
        f"Date={run_date_str}\n"
        f"Prev={prev_alloc_pct}%  Curr={curr_alloc_pct}%\n"
    )

    (OUTPUT_DIR / "subject.txt").write_text(subject, encoding="utf-8")
    (OUTPUT_DIR / "message.txt").write_text(message, encoding="utf-8")

    # HTML template
    html_tpl = Template(r"""
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TQQQ Volatility Target</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f7f7f8; margin:0; padding:24px; }
  h1 { margin:0 0 6px 0; font-size: 40px; }
  .sub { color:#666; margin-bottom:18px; }
  .pill { display:inline-block; background:#eef2ff; color:#111; padding:10px 14px; border-radius:999px; font-size:14px; margin:10px 0 18px 0; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  .card { background:white; border-radius:18px; padding:20px; box-shadow: 0 8px 22px rgba(0,0,0,0.05); }
  .card h2 { margin:0 0 10px 0; font-size:28px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 0; border-bottom:1px solid #eee; font-size:18px; }
  td:last-child { text-align:right; font-weight:600; }
  .muted { color:#777; font-weight:500; }
  .big { font-weight:800; }
  .wide { grid-column: 1 / -1; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <h1>TQQQ Volatility Target</h1>
  <div class="sub">Weekly sizing based on realized volatility</div>
  <div class="pill">Target Vol = 20% • Lookback = 20 days • Rounding = 5% • Mode = $MODE</div>

  <div class="grid">
    <div class="card">
      <h2>This week</h2>
      <table>
        <tr><td class="muted">Date</td><td>$RUN_DATE</td></tr>
        <tr><td class="muted">TQQQ Close</td><td>$$CLOSE</td></tr>
        <tr><td class="muted">Realized Vol (20d)</td><td>$VOL%</td></tr>
        <tr><td class="big">Previous Allocation</td><td class="big">$PREV% TQQQ</td></tr>
        <tr><td class="big">Current Allocation</td><td class="big">$CURR% TQQQ</td></tr>
        <tr><td class="muted">Cash / BIL</td><td>$CASH%</td></tr>
      </table>
      <div class="muted" style="margin-top:10px;">Generated: $GEN_TIME</div>
    </div>

    <div class="card">
      <h2>How it works</h2>
      <div style="font-size:18px; line-height:1.5;">
        <ul>
          <li>Compute 20-day realized volatility (annualized) from daily closes.</li>
          <li>Allocation ≈ TargetVol ÷ RealizedVol (clamped 0–100%).</li>
          <li>Round to 5% steps to reduce churn.</li>
          <li>Run after Friday close; execute Monday after the open.</li>
          <li>"Cash" sleeve can be BIL/SGOV (or your preferred T-bill ETF).</li>
        </ul>
      </div>
    </div>

    <div class="card wide">
      <h2>Last 365 days trend (allocation + vol)</h2>
      <canvas id="chart"></canvas>
      <div style="margin-top:10px; color:#777;">Data comes from logs/history_official.csv (official) or logs/history_debug.csv (debug).</div>
    </div>
  </div>

<script>
  const labels = $CHART_DATES;
  const alloc = $CHART_ALLOC;
  const vol   = $CHART_VOL;

  const ctx = document.getElementById("chart");
  new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "TQQQ Allocation (%)",
          data: alloc,
          borderColor: "#4f83ff",
          tension: 0.25,
          yAxisID: "y",
        },
        {
          label: "Realized Vol 20d (%)",
          data: vol,
          borderColor: "#ff6b81",
          tension: 0.25,
          yAxisID: "y1",
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        y: { position: "left", min: 0, max: 100, title: { display: true, text: "Allocation (%)" } },
        y1: { position: "right", min: 0, max: 80, grid: { drawOnChartArea: false }, title: { display: true, text: "Realized Vol (%)" } }
      }
    }
  });
</script>

</body>
</html>
""")

    html = html_tpl.substitute(
        MODE=mode,
        RUN_DATE=run_date_str,
        CLOSE=f"{last_close:.2f}",
        VOL=f"{realized_vol_pct:.1f}",
        PREV=str(prev_alloc_pct),
        CURR=str(curr_alloc_pct),
        CASH=str(curr_cash_pct),
        GEN_TIME=utc_now_str(),
        CHART_DATES=chart_dates_js,
        CHART_ALLOC=chart_alloc_js,
        CHART_VOL=chart_vol_js,
    )

    report_file.write_text(html, encoding="utf-8")
    latest_file.write_text(html, encoding="utf-8")

    print(f"✅ Mode={mode} DEBUG_RUN={int(debug_run)}")
    print(f"✅ Appended history: {'logs/history_debug.csv' if debug_run else 'logs/history_official.csv'}")
    print(f"✅ Wrote dated report: {report_file}")
    print(f"✅ Wrote latest file: {latest_file}")
    print(f"✅ Latest report URL: {report_url}")

if __name__ == "__main__":
    main()
 
