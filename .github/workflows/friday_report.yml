name: Friday TQQQ Vol Report

on:
  # Runs automatically on Fridays (official run)
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

  # Manual runs (debug by default, optional official)
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: debug (default) or official"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - official

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Decide whether this is OFFICIAL or DEBUG
      - name: Decide run mode
        id: mode
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          INPUT_MODE="${{ github.event.inputs.run_mode }}"
          if [ "$EVENT" = "schedule" ]; then
            MODE="official"
          else
            MODE="$INPUT_MODE"
          fi
          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "Run mode = $MODE"

      # 🔒 Guardrail: block "official" unless it's actually Friday (UTC weekday 5 is Friday in cron, but this is an extra safety net)
      - name: Guardrail - Official only allowed on Friday
        if: env.MODE == 'official'
        run: |
          set -e
          DOW=$(date -u +%u)  # 1=Mon ... 5=Fri ... 7=Sun
          if [ "$DOW" != "5" ]; then
            echo "❌ Official run attempted on non-Friday (UTC). Use debug mode for manual runs."
            exit 1
          fi

      - name: Run weekly report
        run: |
          set -e
          python fetch_tqqq.py
          python weekly_report.py

      # Separate history: official runs write history_official.csv, debug runs write history_debug.csv
      # This prevents manual runs from changing what "previous allocation" means for the official Friday signal.
      - name: Move history to official/debug file
        run: |
          set -e
          mkdir -p logs
          if [ "${MODE}" = "official" ]; then
            if [ -f logs/history.csv ]; then
              cp logs/history.csv logs/history_official.csv
            fi
          else
            if [ -f logs/history.csv ]; then
              cp logs/history.csv logs/history_debug.csv
            fi
          fi

      - name: Commit updated data + report
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ logs/ output/
          git commit -m "Weekly TQQQ vol report (${MODE}) ($(date -u +%Y-%m-%d))" || echo "No changes"
          git push

      # -----------------------------
      # Publish HTML to GitHub Pages
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Prepare notification text
      # -----------------------------
      - name: Prepare notification text
        run: |
          set -e

          # weekly_report.py should write these (if present):
          # output/latest_report_path.txt  (example: reports/2026-02-09.html)
          # output/subject.txt
          # output/message.txt
          #
          # If latest_report_path.txt is missing, fall back to weekly_report.html
          if [ -f output/latest_report_path.txt ]; then
            REL_PATH="$(cat output/latest_report_path.txt | tr -d '\r\n')"
            REPORT_URL="https://stegitforme.github.io/tqqq-vol-target/${REL_PATH}"
          else
            REPORT_URL="https://stegitforme.github.io/tqqq-vol-target/weekly_report.html"
          fi

          SUBJECT="$(cat output/subject.txt 2>/dev/null || echo 'TQQQ Vol Target Weekly Report')"
          MESSAGE="$(cat output/message.txt 2>/dev/null || echo 'Report generated.')"

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set -e

          if [ -z "${PUSHOVER_USER_KEY:-}" ]; then
            echo "❌ Missing PUSHOVER_USER_KEY secret"
            exit 1
          fi
          if [ -z "${PUSHOVER_API_TOKEN:-}" ]; then
            echo "❌ Missing PUSHOVER_API_TOKEN secret"
            exit 1
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json

      # -----------------------------
      # Email (SMTP)
      # -----------------------------
      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          def clean(s: str) -> str:
            # Prevent the exact Unicode error you saw: NBSP (\u00a0) copied into secrets
            return s.replace("\u00a0", " ").strip()

          smtp_server = clean(os.environ["SMTP_SERVER"])
          smtp_port = int(clean(os.environ.get("SMTP_PORT", "587")))
          smtp_user = clean(os.environ["SMTP_USERNAME"])
          smtp_pass = clean(os.environ["SMTP_PASSWORD"])
          email_from = clean(os.environ["EMAIL_FROM"])
          email_to = clean(os.environ["EMAIL_TO"])

          subject = os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report")
          body = open("/tmp/notify_body.txt", "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
            s.ehlo()
            s.starttls()
            s.login(smtp_user, smtp_pass)
            s.send_message(msg)

          print(f"✅ Email sent to {email_to}")
          PY
