name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - official
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # Decide run mode (FIXED)
      #   - schedule => ALWAYS official
      #   - workflow_dispatch => use input (default debug)
      #   - safe fallback if MODE is blank
      # -----------------------------
      - name: Decide run mode
        id: mode
        run: |
          set -e

          EVENT_NAME="${{ github.event_name }}"
          INPUT_MODE="${{ github.event.inputs.mode }}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE="official"
          else
            MODE="$INPUT_MODE"
          fi

          # Safety: if MODE is blank for any reason, default to official
          if [ -z "${MODE:-}" ]; then
            MODE="official"
          fi

          TODAY_UTC=$(date -u +%u)

          # Block "official" runs on non-Friday UTC (prevents manual official runs mid-week)
          if [ "$MODE" = "official" ] && [ "$TODAY_UTC" != "5" ]; then
            echo "❌ Official run blocked: today is not Friday (UTC day=$TODAY_UTC). Use debug mode."
            exit 1
          fi

          if [ "$MODE" = "debug" ]; then
            echo "DEBUG_RUN=1" >> $GITHUB_ENV
          else
            echo "DEBUG_RUN=0" >> $GITHUB_ENV
          fi

          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "Run mode: $MODE (event=$EVENT_NAME, utc_day=$TODAY_UTC)"

      # -----------------------------
      # Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Generate report
      # -----------------------------
      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      # -----------------------------
      # Commit data + report
      # -----------------------------
      - name: Commit updated data + report
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ "$DEBUG_RUN" = "1" ]; then
            git add output/ reports/ logs/history.csv || true
            git commit -m "Debug TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          else
            git add output/ reports/ logs/history.csv logs/history_official.csv || true
            git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          fi

          git push

      # -----------------------------
      # GitHub Pages
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Prepare notification text
      # -----------------------------
      - name: Prepare notification text
        run: |
          set -e

          REPORT_PATH="$(cat output/latest_report_path.txt)"
          REPORT_URL="$(cat output/latest_report_url.txt)"

          SUBJECT="$(cat output/subject.txt)"
          MESSAGE="$(cat output/message.txt)"

          {
            echo "$MESSAGE"
            echo "Mode=$MODE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Skipping Pushover (missing secrets)"
            exit 0
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report" \
            https://api.pushover.net/1/messages.json

      # -----------------------------
      # Email (SMTP) — SAFE VERSION
      # -----------------------------
      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          path = "/tmp/notify_body.txt"
          if not os.path.exists(path):
              print("Skipping email (no body)")
              raise SystemExit(0)

          def clean(s):
              return s.replace("\u00a0", " ").strip()

          smtp_server = clean(os.environ["SMTP_SERVER"])
          smtp_port = int(clean(os.environ.get("SMTP_PORT", "587")))
          smtp_user = clean(os.environ["SMTP_USERNAME"])
          smtp_pass = clean(os.environ["SMTP_PASSWORD"])
          email_from = clean(os.environ["EMAIL_FROM"])
          email_to = clean(os.environ["EMAIL_TO"])
          subject = clean(os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report"))

          body = open(path, "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
              s.ehlo()
              s.starttls()
              s.login(smtp_user, smtp_pass)
              s.send_message(msg)

          print("✅ Email sent")
          PY
