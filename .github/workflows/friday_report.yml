name: Weekly TQQQ Volatility Report

on:
  schedule:
    # Every Friday at 22:10 UTC (~5:10pm ET after market close)
    - cron: "10 22 * * 5"
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch TQQQ data
        run: |
          python fetch_tqqq.py

      - name: Run weekly report
        run: |
          python weekly_report.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/TQQQ.csv output/*.html state/*.json logs/*.log || true
          git commit -m "Weekly TQQQ vol report" || echo "No changes"
          git push
