name: TQQQ Vol Target Weekly Report

on:
  workflow_dispatch: {}
  schedule:
    # Friday 22:10 UTC ≈ Friday 2:10pm Los Angeles (PST)
    # During daylight savings, this will be ~1 hour later
    - cron: "10 22 * * 5"

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Debug step so we can always see what files exist
      - name: Debug - list repo files
        run: |
          pwd
          ls -la

      - name: Run weekly report
        run: |
          python weekly_report.py

      - name: Upload weekly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            output/weekly_report.html
            data/TQQQ.csv
            logs/
