name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit updated data + report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ logs/ output/
          git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          git push

      # -----------------------------
      # Publish HTML to GitHub Pages
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Build link + message text (links to dated snapshot)
      # -----------------------------
      - name: Prepare notification text
        run: |
          set -e

          REPORT_PATH="$(cat output/report_path.txt 2>/dev/null || echo 'weekly_report.html')"
          REPORT_URL="https://stegitforme.github.io/tqqq-vol-target/${REPORT_PATH}"

          SUBJECT="$(cat output/subject.txt 2>/dev/null || echo 'TQQQ Vol Target Weekly Report')"
          MESSAGE="$(cat output/message.txt 2>/dev/null || echo 'Report generated.')"

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set -e

          if [ -z "${PUSHOVER_USER_KEY:-}" ]; then
            echo "❌ Missing PUSHOVER_USER_KEY secret"
            exit 1
          fi
          if [ -z "${PUSHOVER_API_TOKEN:-}" ]; then
            echo "❌ Missing PUSHOVER_API_TOKEN secret"
            exit 1
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json

      # -----------------------------
      # Email (SMTP)
      # -----------------------------
      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          smtp_server = os.environ["SMTP_SERVER"].strip()
          smtp_port = int(str(os.environ.get("SMTP_PORT", "587")).strip())
          smtp_user = os.environ["SMTP_USERNAME"].strip()
          smtp_pass = os.environ["SMTP_PASSWORD"].strip()
          email_from = os.environ["EMAIL_FROM"].strip()
          email_to = os.environ["EMAIL_TO"].strip()

          # Prevent UnicodeEncodeError from non-breaking spaces in secrets/subject
          subject = os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report")
          subject = subject.replace("\u00a0", " ").strip()

          body = open("/tmp/notify_body.txt", "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
              s.ehlo()
              s.starttls()
              s.login(smtp_user, smtp_pass)
              s.send_message(msg)

          print(f"✅ Email sent to {email_to}")
          PY
