      - name: Send email (debug + sanitize)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python - << 'PY'
          import os, re, smtplib
          from email.message import EmailMessage
          from pathlib import Path

          def clean_generic(s: str) -> str:
              if s is None:
                  return ""
              # Replace NBSP with normal space, strip ends
              return s.replace("\u00a0", " ").strip()

          def clean_password(s: str) -> str:
              s = clean_generic(s)
              # App passwords are often pasted with spaces; remove ALL whitespace
              return re.sub(r"\s+", "", s)

          def find_non_ascii(s: str):
              bad = []
              for i, ch in enumerate(s):
                  if ord(ch) > 127:
                      bad.append((i, ch, f"U+{ord(ch):04X}"))
              return bad

          # Read env
          raw = {
              "SMTP_SERVER": os.environ.get("SMTP_SERVER", ""),
              "SMTP_PORT": os.environ.get("SMTP_PORT", "465"),
              "SMTP_USERNAME": os.environ.get("SMTP_USERNAME", ""),
              "SMTP_PASSWORD": os.environ.get("SMTP_PASSWORD", ""),
              "EMAIL_TO": os.environ.get("EMAIL_TO", ""),
              "EMAIL_FROM": os.environ.get("EMAIL_FROM", ""),
          }

          # Sanitize
          smtp_server = clean_generic(raw["SMTP_SERVER"])
          smtp_port = int(clean_generic(raw["SMTP_PORT"]) or "465")
          smtp_user = clean_generic(raw["SMTP_USERNAME"])
          smtp_pass = clean_password(raw["SMTP_PASSWORD"])
          email_to = clean_generic(raw["EMAIL_TO"])
          email_from = clean_generic(raw["EMAIL_FROM"]) or smtp_user

          cleaned = {
              "SMTP_SERVER": smtp_server,
              "SMTP_PORT": str(smtp_port),
              "SMTP_USERNAME": smtp_user,
              "SMTP_PASSWORD": smtp_pass,
              "EMAIL_TO": email_to,
              "EMAIL_FROM": email_from,
          }

          # Validate presence
          missing = [k for k,v in cleaned.items() if k != "SMTP_PORT" and not v]
          if missing:
              raise SystemExit("❌ Missing required secrets: " + ", ".join(missing))

          # Detect non-ascii BEFORE login and tell you exactly which secret is dirty
          for k, v in cleaned.items():
              bad = find_non_ascii(v)
              if bad:
                  # Print only positions and codepoints; do not print content
                  positions = [f"pos={i} {cp}" for (i, ch, cp) in bad]
                  raise SystemExit(
                      f"❌ '{k}' contains non-ASCII characters: {positions}. "
                      f"Most common is NBSP (U+00A0). Recreate that secret in GitHub Actions."
                  )

          # Load HTML
          html_path = Path("output/weekly_report.html")
          if not html_path.exists():
              raise SystemExit("❌ output/weekly_report.html not found")

          html = html_path.read_text(encoding="utf-8")

          # Compose email
          msg = EmailMessage()
          msg["Subject"] = "TQQQ Vol Target — Weekly Report"
          msg["From"] = email_from
          msg["To"] = email_to
          msg.set_content("Weekly report attached + inline.")
          msg.add_alternative(html, subtype="html")

          # Send
          with smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=30) as s:
              s.login(smtp_user, smtp_pass)
              s.send_message(msg)

          print("✅ Email sent to", email_to)
          PY
