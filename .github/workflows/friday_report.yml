name: Weekly TQQQ vol report

on:
  workflow_dispatch: {}
  schedule:
    # Fridays at 21:10 UTC (~1:10pm PT standard time).
    # If you want a different time, tell me your timezone + target time and I’ll adjust.
    - cron: "10 21 * * 5"

permissions:
  contents: write

concurrency:
  group: weekly-tqqq-vol-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          set -e
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit & push outputs (data/logs/output)
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Make sure folders exist (won’t error if already present)
          mkdir -p data logs output

          # Stage the files you want tracked
          git add data/ logs/ output/

          # If nothing changed, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d))"
          git push
