name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit updated data + report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ logs/ output/
          git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          git push

      # -----------------------------
      # Publish HTML to GitHub Pages
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Prepare notification text
      # -----------------------------
      - name: Prepare notification text
        shell: bash
        run: |
          set -euo pipefail

          REPORT_URL="https://stegitforme.github.io/tqqq-vol-target/weekly_report.html"

          SUBJECT="$(cat output/subject.txt 2>/dev/null || echo 'TQQQ Vol Target Weekly Report')"
          MESSAGE="$(cat output/message.txt 2>/dev/null || echo 'Report generated.')"

          # Export safely (subject may contain spaces)
          {
            echo "REPORT_URL=$REPORT_URL"
            echo "SUBJECT<<EOF"
            echo "$SUBJECT"
            echo "EOF"
          } >> "$GITHUB_ENV"

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        shell: bash
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PUSHOVER_USER_KEY:-}" ]; then
            echo "❌ Missing PUSHOVER_USER_KEY secret"
            exit 1
          fi
          if [ -z "${PUSHOVER_API_TOKEN:-}" ]; then
            echo "❌ Missing PUSHOVER_API_TOKEN secret"
            exit 1
          fi

          RESP="$(curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json)"

          echo "$RESP"

          python -c "import json,sys; r=json.loads(sys.stdin.read()); \
print('✅ Pushover sent' if int(r.get('status',0))==1 else '❌ Pushover failed'); \
sys.exit(0 if int(r.get('status',0))==1 else 1)" <<< "$RESP"

      # -----------------------------
      # Email (SMTP) — sanitize NBSP in secrets
      # -----------------------------
      - name: Send email (SMTP)
        if: always()
        shell: bash
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail

          python - << 'PY'
          import os, ssl, smtplib
          from email.message import EmailMessage

          def clean(s: str) -> str:
              # Replace non-breaking spaces and strip
              return (s or "").replace("\u00a0", " ").strip()

          def req(name: str) -> str:
              v = clean(os.environ.get(name, ""))
              if not v:
                  raise SystemExit(f"❌ Missing {name} (secret/env)")
              return v

          smtp_server = req("SMTP_SERVER")
          smtp_port   = int(req("SMTP_PORT"))
          smtp_user   = req("SMTP_USERNAME")
          smtp_pass   = req("SMTP_PASSWORD")
          email_from  = req("EMAIL_FROM")
          email_to    = req("EMAIL_TO")

          subject = clean(os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report"))
          report_url = clean(os.environ.get("REPORT_URL", ""))

          with open("/tmp/notify_body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          # Extra safety: make sure the email body is clean text
          body = body.replace("\u00a0", " ")

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          ctx = ssl.create_default_context()

          if smtp_port == 465:
              with smtplib.SMTP_SSL(smtp_server, smtp_port, context=ctx, timeout=30) as s:
                  s.login(smtp_user, smtp_pass)
                  s.send_message(msg)
          else:
              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
                  s.ehlo()
                  s.starttls(context=ctx)
                  s.ehlo()
                  s.login(smtp_user, smtp_pass)
                  s.send_message(msg)

          print(f"✅ Email sent to {email_to}")
          if report_url:
              print(f"Report URL: {report_url}")
          PY
