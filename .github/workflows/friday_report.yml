name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - official
      asof:
        description: "AS-OF date (YYYY-MM-DD). Leave blank to use latest available close."
        required: false
        default: ""
      force_official:
        description: "Allow OFFICIAL manual run even if not Friday (use carefully)"
        required: false
        default: false
        type: boolean

  schedule:
    # Run later on Friday so Yahoo data is definitely updated.
    # 01:10 UTC Saturday = 8:10pm ET Friday = 5:10pm PT Friday
    - cron: "10 1 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decide run mode
        id: mode
        run: |
          set -e

          EVENT="${{ github.event_name }}"
          MODE_INPUT="${{ github.event.inputs.mode }}"
          ASOF_INPUT="${{ github.event.inputs.asof }}"
          FORCE_OFFICIAL="${{ github.event.inputs.force_official }}"

          TODAY_UTC=$(date -u +%u)

          # Scheduled runs are always official
          if [ "$EVENT" = "schedule" ]; then
            MODE="official"
          else
            MODE="${MODE_INPUT:-debug}"
          fi

          # Guardrail: block official unless it's Friday UTC, unless schedule OR force_official=true
          if [ "$MODE" = "official" ] && [ "$EVENT" != "schedule" ] && [ "$FORCE_OFFICIAL" != "true" ] && [ "$TODAY_UTC" != "5" ]; then
            echo "❌ Official run blocked: today is not Friday (UTC day=$TODAY_UTC). Use debug, or set force_official=true."
            exit 1
          fi

          if [ "$MODE" = "debug" ]; then
            echo "DEBUG_RUN=1" >> $GITHUB_ENV
          else
            echo "DEBUG_RUN=0" >> $GITHUB_ENV
          fi

          # Optional AS-OF date
          echo "ASOF_DATE=$ASOF_INPUT" >> $GITHUB_ENV
          echo "MODE=$MODE" >> $GITHUB_ENV

          echo "Run mode: $MODE (event=$EVENT, utc_day=$TODAY_UTC, asof=$ASOF_INPUT)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py
        env:
          ASOF_DATE: ${{ env.ASOF_DATE }}
          MODE: ${{ env.MODE }}
          DEBUG_RUN: ${{ env.DEBUG_RUN }}

      - name: Commit updated data + report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ "$DEBUG_RUN" = "1" ]; then
            git add output/ reports/ logs/history.csv || true
            git commit -m "Debug TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          else
            git add output/ reports/ logs/history.csv logs/history_official.csv || true
            git commit -m "Official TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          fi

          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Prepare notification text
        run: |
          set -e

          REPORT_URL="$(cat output/latest_report_url.txt)"
          SUBJECT="$(cat output/subject.txt)"
          MESSAGE="$(cat output/message.txt)"

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Skipping Pushover (missing secrets)"
            exit 0
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report" \
            https://api.pushover.net/1/messages.json

      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          path = "/tmp/notify_body.txt"
          if not os.path.exists(path):
              print("Skipping email (no body)")
              raise SystemExit(0)

          def clean(s: str) -> str:
              return (s or "").replace("\u00a0", " ").strip()

          smtp_server = clean(os.environ.get("SMTP_SERVER", ""))
          smtp_port_raw = clean(os.environ.get("SMTP_PORT", ""))
          smtp_user = clean(os.environ.get("SMTP_USERNAME", ""))
          smtp_pass = clean(os.environ.get("SMTP_PASSWORD", ""))
          email_from = clean(os.environ.get("EMAIL_FROM", ""))
          email_to = clean(os.environ.get("EMAIL_TO", ""))
          subject = clean(os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report"))

          if not smtp_server or not smtp_user or not smtp_pass or not email_from or not email_to:
              print("Skipping email (missing SMTP secrets)")
              raise SystemExit(0)

          smtp_port = int(smtp_port_raw or "587")
          body = open(path, "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
              s.ehlo()
              s.starttls()
              s.login(smtp_user, smtp_pass)
              s.send_message(msg)

          print("✅ Email sent")
          PY
