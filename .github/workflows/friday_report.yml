name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - official
      asof:
        description: "AS-OF date (YYYY-MM-DD). Leave blank to use latest available close."
        required: false
        default: ""
      force_official:
        description: "Allow OFFICIAL manual run even if not Friday (use carefully)"
        required: false
        default: false
        type: boolean

  schedule:
    # TQQQ-PUB-001 — 02:10 UTC Saturday = 9:10pm ET Friday = 6:10pm PT Friday.
    # The previous comment claimed Yahoo is "definitely updated" by 5:10pm PT. On 2026-09-04 it was
    # not: the run fetched bars ending THURSDAY and published Thursday's signal as Friday's. This
    # hour of extra settlement margin sits BEHIND the freshness gate and is not the fix — the gate
    # is. (The gate would have caught that run at the old time too; see freshness_gate.py.)
    - cron: "10 2 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        # TQQQ-PUB-001 — ref: main + full history. A "Re-run all jobs" checks out the run's ORIGINAL
        # SHA by default, which is how the 2026-09-05 repair attempt died: it was based on a commit
        # that predated Friday night's data commit, so its push was rejected non-fast-forward.
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide run mode
        id: mode
        run: |
          set -e

          EVENT="${{ github.event_name }}"
          MODE_INPUT="${{ github.event.inputs.mode }}"
          ASOF_INPUT="${{ github.event.inputs.asof }}"
          FORCE_OFFICIAL="${{ github.event.inputs.force_official }}"

          # Get current day of week in UTC (1=Mon ... 5=Fri ... 7=Sun)
          TODAY_UTC=$(date -u +%u)

          # Scheduled runs are always official
          if [ "$EVENT" = "schedule" ]; then
            MODE="official"
          else
            MODE="${MODE_INPUT:-debug}"
          fi

          # Guardrail: block manual OFFICIAL runs on non-Friday unless force_official=true
          if [ "$MODE" = "official" ] && [ "$EVENT" != "schedule" ] && [ "$FORCE_OFFICIAL" != "true" ] && [ "$TODAY_UTC" != "5" ]; then
            echo "Official run blocked: today is not Friday (UTC day=$TODAY_UTC). Use debug, or check force_official."
            exit 1
          fi

          if [ "$MODE" = "debug" ]; then
            echo "DEBUG_RUN=1" >> $GITHUB_ENV
          else
            echo "DEBUG_RUN=0" >> $GITHUB_ENV
          fi

          echo "ASOF_DATE=$ASOF_INPUT" >> $GITHUB_ENV
          echo "MODE=$MODE" >> $GITHUB_ENV

          echo "Run mode: $MODE (event=$EVENT, utc_day=$TODAY_UTC, asof=${ASOF_INPUT:-latest})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch price data
        run: python fetch_tqqq.py

      # TQQQ-PUB-001 TASK 1 — THE FRESHNESS GATE. Between the fetch and the report, deliberately:
      # every publish step below is downstream of it, so a nonzero exit here means NOTHING is
      # published — no history row, no RTDB PUT, no Pages deploy, no success notification.
      # A RED RUN BEATS A GREEN RUN THAT LIED.
      - name: Freshness gate (official runs)
        run: python freshness_gate.py
        env:
          ASOF_DATE: ${{ env.ASOF_DATE }}
          MODE: ${{ env.MODE }}

      - name: Run weekly report
        run: python weekly_report.py
        env:
          ASOF_DATE: ${{ env.ASOF_DATE }}
          MODE: ${{ env.MODE }}
          DEBUG_RUN: ${{ env.DEBUG_RUN }}

      - name: Authenticate to Google Cloud (WIF / OIDC)
        if: env.MODE == 'official'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNAL_WRITER_SA }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'

      - name: Publish signal to RTDB (official runs)
        if: env.MODE == 'official'
        run: |
          set -e
          TOKEN="${{ steps.gcp-auth.outputs.access_token }}"
          if [ -z "$TOKEN" ]; then echo "No access token from auth step"; exit 1; fi
          if [ ! -f signals/tqqq_vol_latest.json ]; then echo "signal file missing"; exit 1; fi
          HTTP=$(curl -s -o /tmp/put_resp.json -w '%{http_code}' \
            -X PUT -H 'Content-Type: application/json' \
            --data @signals/tqqq_vol_latest.json \
            "https://gogo-trading-81293-default-rtdb.firebaseio.com/signals/tqqq_vol/latest.json?access_token=$TOKEN")
          echo "RTDB PUT HTTP $HTTP"; cat /tmp/put_resp.json
          [ "$HTTP" = "200" ] || { echo "PUT failed (HTTP $HTTP)"; exit 1; }

      # TQQQ-PUB-001 TASK 6 — RUNDATE SEMANTICS, ONCE, HERE.
      #   RunDate  = the date of the NEWEST BAR the signal was computed from. For an official run
      #              TASK 1's gate guarantees that is the target trading day (the Friday), because a
      #              run whose newest bar is older EXITS before reaching this step.
      #   The COMMIT's own date is `date -u` at commit time, which for a Friday-evening PT run is
      #              already SATURDAY in UTC. So "Official TQQQ vol report (2026-09-05)" naming a
      #              row whose RunDate is 2026-09-04 is CORRECT and expected — the two dates answer
      #              different questions. The 2026-09-04 incident looked like this in the log and was
      #              a genuinely different failure: the newest BAR was Thursday.
      - name: Commit updated data + report
        if: env.MODE == 'official'
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # TQQQ-PUB-001b TASK 1 — STAGE BOTH FETCHED CSVs. fetch_tqqq.py rewrites data/TQQQ.csv AND
          # data/QQQ.csv, and BOTH are tracked. PUB-001 staged only QQQ.csv, so TQQQ.csv was left
          # modified-but-unstaged and `git pull --rebase` REFUSED to run at all ("cannot pull with
          # rebase: You have unstaged changes"). Committing one of two siblings the same command
          # rewrites is what dirtied the tree.
          if [ "$DEBUG_RUN" = "1" ]; then
            git add output/ logs/history.csv data/TQQQ.csv data/QQQ.csv || true
            git commit -m "Debug TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          else
            git add output/ logs/history.csv logs/history_official.csv data/TQQQ.csv data/QQQ.csv || true
            git commit -m "Official TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          fi

          # TQQQ-PUB-001 TASK 5 — INTEGRATE BEFORE PUSHING. A re-run based on an older SHA, or any
          # commit that landed while this job was computing, would otherwise be rejected
          # non-fast-forward — which is exactly how the 2026-09-05 repair attempt died with the
          # report generated and nothing published.
          #
          # ON CONFLICT WE FAIL LOUDLY AND STOP. history.csv is append-mostly, so a conflict means
          # two runs appended for overlapping dates, and NO automatic resolution is trustworthy:
          # "ours" silently drops the other run's row, "theirs" silently drops this one's, and a
          # union can interleave dates. A human must look. The gate has already guaranteed nothing
          # false was computed, so stopping here costs a publish, not correctness.
          #
          # TQQQ-PUB-001b TASK 2 — --autostash: belt AND suspenders. TASK 1 makes today's dirty-tree
          # case impossible by construction, but any FUTURE unstaged leftover (a new fetch artifact,
          # a stray log) would refuse the pull exactly the same way. Autostash carries it across the
          # rebase instead of turning a publishable run into a red one.
          #
          # TQQQ-PUB-001b TASK 3 — DIAGNOSE, DON'T ASSUME. PUB-001's handler called every pull
          # failure a "rebase CONFLICT" and blind-fired `git rebase --abort`, which on run #108
          # printed `fatal: no rebase in progress` and told a human to hand-resolve a conflict that
          # did not exist. The real cause was a REFUSAL — the pull never started. These are opposite
          # problems and they now read differently.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main > /tmp/pull.log 2>&1; then
              cat /tmp/pull.log
              if git push origin HEAD:main; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (a concurrent commit landed) — retrying"
            else
              cat /tmp/pull.log
              # A rebase is only IN PROGRESS if git says so. Abort only then, so `fatal: no rebase in
              # progress` can never appear inside a diagnosis again.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                CONFLICTS="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
                git rebase --abort || true
                echo "::error::TQQQ-PUB-001: genuine rebase CONFLICT integrating with origin/main."
                echo "::error::Conflicted paths: ${CONFLICTS:-unknown}"
                echo "::error::history.csv is append-mostly, so this means two runs appended over overlapping dates."
                echo "::error::NOT auto-resolving: every automatic choice silently drops a row. Resolve by hand."
                exit 1
              fi
              if grep -qi "unstaged changes\|cannot pull with rebase\|local changes" /tmp/pull.log; then
                echo "::error::TQQQ-PUB-001b: the pull REFUSED TO START — the working tree was dirty."
                echo "::error::This is NOT a conflict and there is nothing to hand-resolve."
                echo "::error::Untracked/unstaged leftovers:"
                git status --porcelain || true
                echo "::error::Fix: add the offending path to the commit step's \`git add\` list (see TASK 1)."
                exit 1
              fi
              echo "::error::TQQQ-PUB-001: the pull failed for a reason that is neither a conflict nor a dirty tree."
              echo "::error::Full pull output is above — read it rather than assuming."
              exit 1
            fi
          done
          echo "::error::TQQQ-PUB-001: push still rejected after 3 attempts (persistent concurrent writer)."
          exit 1

      - name: Upload Pages artifact
        if: env.MODE == 'official'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        if: env.MODE == 'official'
        uses: actions/deploy-pages@v4

      - name: Prepare notification text
        if: env.MODE == 'official'
        run: |
          set -e
          REPORT_URL="$(cat output/latest_report_url.txt)"
          SUBJECT="$(cat output/subject.txt)"
          MESSAGE="$(cat output/message.txt)"

          {
            echo "$MESSAGE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt
          if [ -f "output/email_html.html" ]; then cp output/email_html.html /tmp/email_html.html; fi

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

      - name: Send Pushover notification
        if: env.MODE == 'official'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Skipping Pushover (missing secrets)"
            exit 0
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report" \
            https://api.pushover.net/1/messages.json

      - name: Send email (SMTP)
        if: env.MODE == 'official'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.message import EmailMessage

          path = "/tmp/notify_body.txt"
          if not os.path.exists(path):
              print("Skipping email (no body)")
              raise SystemExit(0)

          def clean(s: str) -> str:
              return (s or "").replace("\u00a0", " ").strip()

          smtp_server   = clean(os.environ.get("SMTP_SERVER",   ""))
          smtp_port_raw = clean(os.environ.get("SMTP_PORT",     ""))
          smtp_user     = clean(os.environ.get("SMTP_USERNAME", ""))
          smtp_pass     = clean(os.environ.get("SMTP_PASSWORD", ""))
          email_from    = clean(os.environ.get("EMAIL_FROM",    ""))
          email_to      = clean(os.environ.get("EMAIL_TO",      ""))
          subject       = clean(os.environ.get("SUBJECT",       "TQQQ Vol Target Weekly Report"))

          if not smtp_server or not smtp_user or not smtp_pass or not email_from or not email_to:
              print("Skipping email (missing SMTP secrets)")
              raise SystemExit(0)

          smtp_port = int(smtp_port_raw or "587")
          body = open(path, "r", encoding="utf-8").read()
          html_path = "/tmp/email_html.html"
          html_body = open(html_path, "r", encoding="utf-8").read() if os.path.exists(html_path) else None

          # Send individually so each recipient sees only their own address
          recipients = [r.strip() for r in email_to.split(",") if r.strip()]
          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
              s.ehlo()
              s.starttls()
              s.login(smtp_user, smtp_pass)
              for recipient in recipients:
                msg = EmailMessage()
                msg["From"]    = email_from
                msg["To"]      = recipient
                msg["Subject"] = subject
                msg.set_content(body, charset="utf-8")
                if html_body:
                  msg.add_alternative(html_body, subtype="html", charset="utf-8")
                s.send_message(msg)
                print(f"Email sent to {recipient}")
          print(f"Done — {len(recipients)} recipient(s)")
          PY

      # TQQQ-PUB-001 TASK 3 — LOUD FAILURE. Without this a failed official run is silent until the
      # GT-platform Saturday watchdog notices, which is up to a day later. That watchdog stays as
      # the backstop; this is the first line. Deliberately `always()`-free: it fires only on
      # failure, and only for a run that was going to publish.
      - name: Notify on failure (official runs)
        if: failure() && env.MODE == 'official'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Skipping Pushover (missing secrets)"; exit 0
          fi
          newest() { [ -f "$1" ] && tail -n 1 "$1" | cut -d, -f1 || echo "MISSING"; }
          TQ="$(newest data/TQQQ.csv)"; QQ="$(newest data/QQQ.csv)"
          BODY="TQQQ weekly OFFICIAL run FAILED - nothing published for $(date -u +%Y-%m-%d).
          Newest bars: TQQQ $TQ / QQQ $QQ.
          Re-run from Actions once data settles:
          https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=TQQQ weekly run FAILED" \
            --form-string "message=$BODY" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
