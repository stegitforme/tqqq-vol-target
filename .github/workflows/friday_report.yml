name: Friday TQQQ Vol Report

on:
  # Manual run supports "mode"
  workflow_dispatch:
    inputs:
      mode:
        description: "official = updates official history (Fri-only). debug = no official history updates"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - official

  # Scheduled run is the OFFICIAL weekly run
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Decide mode (official vs debug)
      # -----------------------------
      - name: Resolve run mode
        id: mode
        run: |
          set -e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "MODE=official" >> $GITHUB_ENV
          else
            echo "MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          fi
          echo "Run mode: $MODE"

      # -----------------------------
      # Run report generation
      # -----------------------------
      - name: Run weekly report (generate HTML + helper files)
        run: |
          set -e
          python fetch_tqqq.py
          python weekly_report.py

      # -----------------------------
      # Official history locking (Fri-only)
      # - Official runs update logs/history_official.csv
      # - Debug runs do NOT touch official history
      # -----------------------------
      - name: Update OFFICIAL history (Friday only)
        if: env.MODE == 'official'
        run: |
          set -e

          mkdir -p logs
          SRC="logs/history.csv"
          OFF="logs/history_official.csv"

          if [ ! -f "$SRC" ]; then
            echo "❌ Missing $SRC"
            exit 1
          fi

          # If official file doesn't exist yet, initialize it with header
          if [ ! -f "$OFF" ]; then
            head -n 1 "$SRC" > "$OFF"
          fi

          # Append ONLY the latest line (excluding header)
          # This locks "official" state to one row per official run.
          tail -n 1 "$SRC" >> "$OFF"

          echo "✅ Updated $OFF"

      # -----------------------------
      # Prepare notification body + link to newest dated report
      # -----------------------------
      - name: Prepare notification text
        run: |
          set -e

          # These are written by weekly_report.py (new version)
          if [ ! -f "output/latest_report_url.txt" ]; then
            echo "❌ Missing output/latest_report_url.txt"
            exit 1
          fi

          REPORT_URL="$(cat output/latest_report_url.txt | tr -d '\r')"
          SUBJECT="$(cat output/subject.txt 2>/dev/null || echo 'TQQQ Vol Target Weekly Report')"
          MESSAGE="$(cat output/message.txt 2>/dev/null || echo 'Report generated.')"

          echo "REPORT_URL=$REPORT_URL" >> $GITHUB_ENV
          echo "SUBJECT=$SUBJECT" >> $GITHUB_ENV

          {
            echo "$MESSAGE"
            echo ""
            echo "Mode=$MODE"
            echo ""
            echo "Open live report:"
            echo "$REPORT_URL"
            echo ""
            echo "Run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/notify_body.txt

      # -----------------------------
      # Commit files
      # - Always commit output/reports + output/weekly_report.html
      # - Only official runs commit logs/history_official.csv
      # -----------------------------
      - name: Commit updated data + reports
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/ output/

          if [ "$MODE" = "official" ]; then
            git add logs/history_official.csv || true
          fi

          git commit -m "TQQQ vol report ($MODE) ($(date -u +%Y-%m-%d))" || echo "No changes"
          git push

      # -----------------------------
      # Publish HTML to GitHub Pages (always)
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          set -e

          if [ -z "${PUSHOVER_USER_KEY:-}" ]; then
            echo "❌ Missing PUSHOVER_USER_KEY secret"
            exit 1
          fi
          if [ -z "${PUSHOVER_API_TOKEN:-}" ]; then
            echo "❌ Missing PUSHOVER_API_TOKEN secret"
            exit 1
          fi

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$(cat /tmp/notify_body.txt)" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json

      # -----------------------------
      # Email (SMTP) — sanitize creds to prevent \xa0 issues
      # -----------------------------
      - name: Send email (SMTP)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - << 'PY'
          import os, smtplib, re
          from email.message import EmailMessage

          def clean(s: str) -> str:
            # Remove non-breaking spaces and zero-width chars, trim
            return (s or "").replace("\u00a0", " ").replace("\u200b", "").strip()

          smtp_server = clean(os.environ.get("SMTP_SERVER",""))
          smtp_port = int(clean(os.environ.get("SMTP_PORT","587")) or "587")
          smtp_user = clean(os.environ.get("SMTP_USERNAME",""))
          smtp_pass = clean(os.environ.get("SMTP_PASSWORD",""))
          email_from = clean(os.environ.get("EMAIL_FROM",""))
          email_to = clean(os.environ.get("EMAIL_TO",""))

          # Basic validation to avoid confusing socket errors
          if not smtp_server:
            raise RuntimeError("Missing SMTP_SERVER")
          if not smtp_user:
            raise RuntimeError("Missing SMTP_USERNAME")
          if not smtp_pass:
            raise RuntimeError("Missing SMTP_PASSWORD")
          if not email_from:
            raise RuntimeError("Missing EMAIL_FROM")
          if not email_to:
            raise RuntimeError("Missing EMAIL_TO")

          subject = clean(os.environ.get("SUBJECT", "TQQQ Vol Target Weekly Report"))
          body = open("/tmp/notify_body.txt", "r", encoding="utf-8").read()

          msg = EmailMessage()
          msg["From"] = email_from
          msg["To"] = email_to
          msg["Subject"] = subject
          msg.set_content(body, charset="utf-8")

          with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as s:
            s.ehlo()
            s.starttls()
            s.login(smtp_user, smtp_pass)
            s.send_message(msg)

          print(f"✅ Email sent to {email_to}")
          PY
