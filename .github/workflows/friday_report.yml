name: TQQQ Vol Target Weekly Report

on:
  workflow_dispatch: {}
  schedule:
    # Friday 22:10 UTC = Friday 2:10pm Los Angeles during standard time (PST)
    # During daylight savings (PDT), it will run 1 hour later than this.
    - cron: "10 22 * * 5"

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python scripts/weekly_report.py

      - name: Upload weekly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            output/weekly_report.html
            logs/
            data/TQQQ.csv
