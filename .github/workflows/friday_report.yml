name: Friday TQQQ Vol Report

on:
  workflow_dispatch:
  schedule:
    # Friday after market close (6:10pm ET ≈ 23:10 UTC)
    - cron: "10 23 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        run: |
          python fetch_tqqq.py
          python weekly_report.py

      - name: Commit updated data + report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ logs/ output/
          git commit -m "Weekly TQQQ vol report ($(date -u +%Y-%m-%d))" || echo "No changes"
          git push

      # -----------------------------
      # Publish HTML to GitHub Pages
      # -----------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # -----------------------------
      # Push notification (Pushover)
      # -----------------------------
      - name: Send Pushover notification
        if: always()
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          set -e

          SUBJECT="$(cat output/subject.txt 2>/dev/null || echo 'TQQQ Vol Target Weekly Report')"
          MESSAGE="$(cat output/message.txt 2>/dev/null || echo 'Report generated.')"

          REPORT_URL="https://stegitforme.github.io/tqqq-vol-target/weekly_report.html"

          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=$SUBJECT" \
            --form-string "message=$MESSAGE" \
            --form-string "url=$REPORT_URL" \
            --form-string "url_title=Open live report (chart)" \
            https://api.pushover.net/1/messages.json
